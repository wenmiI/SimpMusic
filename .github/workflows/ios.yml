name: iOS

# An unsigned .ipa of the iOS app. Sideload it with SideStore or AltStore, which sign it with your
# own Apple ID as they install it, or sign it yourself (see iosApp/README.md).
on:
  workflow_dispatch:
  push:
    branches: [ios]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'changelogs/**'

jobs:
  build-ios:
    # Intel for its 14 GB: the release link of the Kotlin framework ran out of a 5 GB heap on the
    # 7 GB arm64 runner (2026-11-22). Kotlin/Native cross-compiles for arm64 devices from either.
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Give Gradle room for the framework link
        # Appended, so it replaces the 5 GB of gradle.properties for this build only.
        run: |
          echo "" >> ./gradle.properties
          echo "org.gradle.jvmargs=-Xmx10g -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> ./gradle.properties

      - name: Pick the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build the app
        run: |
          xcodebuild \
            -project iosApp/SimpMusic.xcodeproj \
            -scheme SimpMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SimpMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package an unsigned .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/SimpMusic.xcarchive/Products/Applications/SimpMusic.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/SimpMusic-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-ios-unsigned
          path: SimpMusic-unsigned.ipa
